<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harwinder Singh · Demo C, Elastic Name</title>
<style>
  :root { --f: 'Anybody Variable', sans-serif; --bg: #0c0c0d; --fg: #f4f2ec; --mute: #a9a69d; }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-color: var(--fg) var(--bg); }
  body { background: var(--bg); color: var(--fg); font: 400 1.0625rem/1.5 var(--f); overflow-x: hidden; }
  ::selection { background: var(--fg); color: var(--bg); }
  a { color: inherit; text-underline-offset: .25em; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  header { display: flex; justify-content: space-between; gap: 1rem; padding: 1.4rem clamp(1.25rem, 4vw, 3rem); font-weight: 600; font-variation-settings: 'wdth' 110; }
  header nav { display: flex; gap: 1.4rem; }
  .name { padding: 5vh clamp(1.25rem, 4vw, 3rem) 0; }
  .name h1 { font-weight: 800; text-transform: uppercase; line-height: .86; font-size: clamp(3.2rem, 15.5vw, 17rem); letter-spacing: -.02em; cursor: default; }
  .name h1 span { display: block; white-space: nowrap; }
  .name h1 i { font-style: normal; display: inline-block; font-variation-settings: 'wdth' var(--w, 70), 'wght' var(--g, 800); }
  .sub { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem 3rem; padding: 2.4rem clamp(1.25rem, 4vw, 3rem) 9vh; }
  .sub p { font-size: clamp(1.15rem, 1.9vw, 1.6rem); max-width: 30ch; font-variation-settings: 'wdth' 100; }
  .sub p + p { color: var(--mute); text-align: right; }
  .strip { display: flex; gap: clamp(1rem, 2.4vw, 2.2rem); padding: 0 clamp(1.25rem, 4vw, 3rem) 2rem; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; cursor: grab; }
  .strip::-webkit-scrollbar { display: none; }
  .strip.drag { cursor: grabbing; scroll-snap-type: none; }
  .strip a { flex: none; width: clamp(11rem, 19vw, 17rem); text-decoration: none; scroll-snap-align: start; }
  .strip img { width: 100%; aspect-ratio: 600 / 1299; object-fit: cover; display: block; border-radius: 1.6rem; transition: transform .5s cubic-bezier(.16,1,.3,1); -webkit-user-drag: none; user-select: none; }
  .strip img.art { object-fit: contain; object-position: center; border-radius: .8rem; }
  .strip a:hover img, .strip a:focus-visible img { transform: translateY(-.8rem) rotate(-2deg); }
  .strip b { display: block; margin-top: 1rem; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; font-variation-settings: 'wdth' 80; }
  .strip em { font-style: normal; color: var(--mute); font-size: .95rem; }
  footer { padding: 12vh clamp(1.25rem, 4vw, 3rem) 3rem; }
  footer a.mail { display: block; font-weight: 800; text-transform: uppercase; font-variation-settings: 'wdth' 60; font-size: clamp(1.5rem, 6.4vw, 7rem); line-height: 1; overflow-wrap: anywhere; text-decoration-thickness: .05em; transition: font-variation-settings .6s cubic-bezier(.16,1,.3,1); }
  footer a.mail:hover { font-variation-settings: 'wdth' 78; }
  footer p { margin-top: 2rem; display: flex; gap: 1.5rem; font-weight: 600; }
  @media (max-width: 720px) { .sub p + p { text-align: left; } }
</style>
</head>
<body>
  <header><span>Mohali, India</span><nav><a id="mail-top">Email</a><a id="gh-top" target="_blank" rel="noopener">GitHub</a><a id="cv-top" download>Resume</a></nav></header>
  <main>
    <section class="name"><h1 id="name" aria-label="Harwinder Singh"></h1></section>
    <section class="sub">
      <p>Full stack mobile developer. I build whole apps on my own: the app, the API, the admin panel and the website.</p>
      <p>React Native, Node.js, TypeScript.<br />Four apps in production. Drag to see them.</p>
    </section>
    <section class="strip" id="strip" aria-label="App screens"></section>
  </main>
  <footer><a class="mail" id="mail"></a><p><a id="gh" target="_blank" rel="noopener">GitHub</a><a id="cv" download>Resume PDF</a></p></footer>
<script type="module">
  import '@fontsource-variable/anybody/wdth.css';
  import { gsap } from 'gsap';
  import { APPS, EMAIL, GITHUB, RESUME } from './data.ts';

  const $ = (id) => document.getElementById(id);
  $('mail').textContent = EMAIL;
  ['mail', 'mail-top'].forEach((i) => ($(i).href = `mailto:${EMAIL}`));
  ['cv', 'cv-top'].forEach((i) => ($(i).href = RESUME));
  ['gh', 'gh-top'].forEach((i) => ($(i).href = GITHUB));

  const name = $('name');
  name.innerHTML = ['Harwinder', 'Singh'].map((w) => `<span aria-hidden="true">${[...w].map((c) => `<i>${c}</i>`).join('')}</span>`).join('');
  const letters = [...name.querySelectorAll('i')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || location.search.includes('still');

  /* each letter swells in width and weight as the cursor comes near */
  const setters = letters.map((l) => ({ w: gsap.quickTo(l, '--w', { duration: .6, ease: 'power3' }), el: l }));
  function swell(x, y) {
    setters.forEach(({ w, el }) => {
      const r = el.getBoundingClientRect();
      const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      w(70 + 60 * Math.max(0, 1 - d / (innerWidth * .28)));
    });
  }
  if (!still) {
    addEventListener('pointermove', (e) => swell(e.clientX, e.clientY));
    name.addEventListener('pointerleave', () => setters.forEach(({ w }) => w(70)));
    document.fonts.ready.then(() => {
      gsap.fromTo(letters, { '--w': 150, autoAlpha: 0 }, { '--w': 70, autoAlpha: 1, duration: 1.2, ease: 'expo.out', stagger: .04 });
      gsap.from('.sub p, .strip a', { y: 40, autoAlpha: 0, duration: .8, ease: 'expo.out', stagger: .05, delay: .5 });
    });
  }

  const strip = $('strip');
  strip.innerHTML = APPS.flatMap((a) => a.shots.map((s) =>
    `<a href="${a.url}" target="_blank" rel="noopener"><img src="${s.src}" class="${s.kind}" alt="${a.name} app screen" draggable="false" /><b>${a.name}</b><em>${a.stat} · ${a.role}</em></a>`)).join('');

  /* drag to scroll */
  let down = false, sx = 0, sl = 0, moved = 0;
  strip.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; down = true; moved = 0; sx = e.clientX; sl = strip.scrollLeft; });
  addEventListener('pointermove', (e) => { if (!down) return; moved = Math.abs(e.clientX - sx); if (moved > 4) strip.classList.add('drag'); strip.scrollLeft = sl - (e.clientX - sx); });
  addEventListener('pointerup', () => { down = false; strip.classList.remove('drag'); });
  strip.addEventListener('click', (e) => { if (moved > 4) e.preventDefault(); }, true);
</script>
</body>
</html>
