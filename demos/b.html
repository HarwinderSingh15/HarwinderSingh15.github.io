<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harwinder Singh · Demo B, Stage</title>
<style>
  :root { --glow: #ffe24d; --f: 'Geist Variable', sans-serif; --ink: #0b0b0c; --bg: #f3f3f1; --mute: #5d5d62; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.5 var(--f); overflow-x: hidden; }
  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; text-underline-offset: .25em; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 1.4rem clamp(1.25rem, 4vw, 3rem); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1.2rem; border-radius: 99px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; transition: transform .3s cubic-bezier(.16,1,.3,1); }
  .pill:hover { transform: scale(1.05); }
  .pill.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .top { text-align: center; padding: 6vh 1.25rem 0; }
  h1 { font-size: clamp(2.8rem, 8.2vw, 8rem); font-weight: 650; line-height: .96; letter-spacing: -.045em; text-wrap: balance; }
  .top p { color: var(--mute); font-size: clamp(1.05rem, 1.5vw, 1.3rem); margin: 1.4rem auto 1.8rem; max-width: 40ch; }
  .cta { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }
  .stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(1rem, 4vw, 4rem); padding: 9vh clamp(1.25rem, 4vw, 3rem) 6vh; perspective: 1400px; }
  .stage::before { content: ''; position: absolute; left: 50%; top: 52%; width: min(70vw, 760px); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--glow); filter: blur(90px); opacity: .55; transition: background .8s; z-index: -1; }
  .info h2 { font-size: clamp(2.4rem, 5.5vw, 5.5rem); font-weight: 650; letter-spacing: -.04em; line-height: 1; }
  .info p { color: var(--mute); max-width: 30ch; margin: 1rem 0 1.2rem; }
  .info a { font-weight: 600; }
  .num { text-align: right; }
  .num b { display: block; font-size: clamp(2.4rem, 5.5vw, 5.5rem); font-weight: 650; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .num span { color: var(--mute); }
  .device { width: min(72vw, 300px); aspect-ratio: 600 / 1299; position: relative; transform-style: preserve-3d; will-change: transform; }
  .device img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 2.6rem; border: 7px solid var(--ink); background: var(--ink); box-shadow: 0 3rem 4rem -2rem rgb(0 0 0 / .45); opacity: 0; transition: opacity .6s; }
  .device img.art { object-fit: contain; border: 0; background: none; box-shadow: none; border-radius: 1rem; filter: drop-shadow(0 2rem 2rem rgb(0 0 0 / .3)); }
  .device img.on { opacity: 1; }
  .tabs { display: flex; justify-content: center; gap: .4rem; flex-wrap: wrap; padding: 0 1.25rem 10vh; }
  .tabs button { font: 600 1rem var(--f); min-height: 2.75rem; padding: 0 1.1rem; border-radius: 99px; border: 0; background: none; color: var(--mute); cursor: pointer; transition: background .2s, color .2s; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
  footer { text-align: center; padding: 6vh 1.25rem 4rem; border-top: 1px solid #d9d9d6; }
  footer a.mail { display: block; font-size: clamp(1.4rem, 4.4vw, 4rem); font-weight: 650; letter-spacing: -.04em; overflow-wrap: anywhere; margin-bottom: 1.5rem; }
  @media (max-width: 800px) { .stage { grid-template-columns: 1fr; justify-items: center; text-align: center; } .info p { margin-inline: auto; } .num { text-align: center; order: 3; } .device { order: 2; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header><span>Harwinder Singh</span><a class="pill" id="mail-top">Email me</a></header>
  <main>
    <section class="top">
      <h1>One developer.<br />Whole apps.</h1>
      <p>Full stack mobile developer. React Native, Node.js and TypeScript. Four years of shipping to the App Store and Google Play.</p>
      <div class="cta"><a class="pill" id="mail-cta">Email me</a><a class="pill ghost" id="cv" download>Resume PDF</a></div>
    </section>
    <section class="stage" aria-live="polite">
      <div class="info"><h2 id="name"></h2><p id="line"></p><a id="site" target="_blank" rel="noopener"></a></div>
      <div class="device" id="device"></div>
      <div class="num"><b id="stat"></b><span id="role"></span></div>
    </section>
    <div class="tabs" id="tabs" role="group" aria-label="Choose an app"></div>
  </main>
  <footer><a class="mail" id="mail"></a><a id="gh" target="_blank" rel="noopener">GitHub</a></footer>
<script type="module">
  import '@fontsource-variable/geist';
  import { gsap } from 'gsap';
  import { APPS, EMAIL, GITHUB, RESUME } from './data.ts';

  const $ = (id) => document.getElementById(id);
  $('mail').textContent = EMAIL;
  ['mail', 'mail-top', 'mail-cta'].forEach((i) => ($(i).href = `mailto:${EMAIL}`));
  $('cv').href = RESUME; $('gh').href = GITHUB;

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || location.search.includes('still');
  const frames = APPS.flatMap((a, ai) => a.shots.map((s) => ({ ...s, ai })));
  const device = $('device');
  device.innerHTML = frames.map((f) => `<img src="${f.src}" class="${f.kind}" alt="${APPS[f.ai].name} app screen" />`).join('');
  const imgs = [...device.children];
  $('tabs').innerHTML = APPS.map((a, i) => `<button data-i="${i}" aria-pressed="false">${a.name}</button>`).join('');
  const tabs = [...$('tabs').children];

  let at = -1, app = -1, timer;
  function show(i) {
    at = (i + frames.length) % frames.length;
    imgs.forEach((im, k) => im.classList.toggle('on', k === at));
    const ai = frames[at].ai;
    if (ai === app) return;
    app = ai; const a = APPS[ai];
    document.documentElement.style.setProperty('--glow', a.color === '#f1ece2' ? '#c9a86a' : a.color);
    $('name').textContent = a.name; $('line').textContent = a.line;
    $('site').textContent = a.site; $('site').href = a.url;
    $('stat').textContent = a.stat; $('role').textContent = a.role;
    tabs.forEach((t, k) => t.setAttribute('aria-pressed', String(k === ai)));
    if (!still) gsap.from('#name, #line, #site, #stat, #role', { y: 24, autoAlpha: 0, duration: .6, ease: 'expo.out', stagger: .04 });
  }
  const play = () => { clearInterval(timer); if (!still) timer = setInterval(() => show(at + 1), 2400); };
  tabs.forEach((t) => t.addEventListener('click', () => { show(frames.findIndex((f) => f.ai === +t.dataset.i)); play(); }));
  show(0); play();

  if (!still) {
    const rx = gsap.quickTo(device, 'rotationX', { duration: .8, ease: 'power3' });
    const ry = gsap.quickTo(device, 'rotationY', { duration: .8, ease: 'power3' });
    addEventListener('pointermove', (e) => { ry((e.clientX / innerWidth - .5) * 26); rx((.5 - e.clientY / innerHeight) * 16); });
    document.fonts.ready.then(() => {
      gsap.from('h1', { y: 60, autoAlpha: 0, filter: 'blur(14px)', duration: 1.1, ease: 'expo.out' });
      gsap.from('.top p, .cta', { y: 24, autoAlpha: 0, duration: .8, ease: 'expo.out', stagger: .08, delay: .2 });
      gsap.from(device, { y: 160, rotationX: 35, autoAlpha: 0, duration: 1.3, ease: 'expo.out', delay: .3 });
    });
  }
</script>
</body>
</html>
